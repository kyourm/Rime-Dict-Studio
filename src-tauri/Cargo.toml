[package]
name = "rime-dict-studio"
version = "0.3.2"
description = "A safe cross-platform editor for Rime dictionaries"
authors = ["Rime Dict Studio contributors"]
edition = "2021"

[lib]
name = "rime_dict_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomicwrites = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"

[dev-dependencies]
tempfile = "3"
